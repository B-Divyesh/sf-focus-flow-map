<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Flow Map controls</title>
  </head>
  <body>
    <main id="main">
      <header class="brand">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 23 11 16l6 4 11-12" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="4" cy="23" r="3"/><circle cx="11" cy="16" r="3"/><circle cx="17" cy="20" r="3"/><circle cx="28" cy="8" r="3"/></svg>
        <div><p class="eyebrow">Field recorder</p><h1>Focus Flow Map</h1></div>
      </header>
      <section class="status" aria-labelledby="status-heading">
        <h2 id="status-heading" class="sr-only">Recording status</h2>
        <p class="state"><span class="state-dot" aria-hidden="true"></span><span id="state-label">Checking this page…</span></p>
        <p id="state-detail" class="muted">Record only when you choose to start.</p>
      </section>
      <div class="actions">
        <button id="record" type="button" disabled>Start recording</button>
        <button id="open-map" class="secondary" type="button">Open latest map</button>
      </div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <footer><span>Local only</span><span aria-hidden="true">·</span><span>Values redacted</span></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
